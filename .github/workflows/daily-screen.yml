
name: Daily Japan Stock Screener

on:
  workflow_dispatch:
    inputs:
      base_date:
        description: "Base date YYYY-MM-DD (blank = latest JP trading day)"
        required: false
        type: string
  schedule:
    # JST 07:00（月〜金）
    - cron: "0 22 * * 0-4"

    # JST 18:30（月〜金）
    - cron: "30 9 * * 1-5"
permissions:
  contents: write

concurrency:
  group: daily-japan-stock-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas \
            numpy \
            yfinance \
            openpyxl \
            xlrd \
            requests \
            beautifulsoup4 \
            lxml \
            exchange-calendars

      - name: Determine base date
        id: date
        env:
          MANUAL_BASE_DATE: ${{ github.event.inputs.base_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          import pandas as pd
          import exchange_calendars as xcals

          today = datetime.now(
              ZoneInfo("Asia/Tokyo")
          ).date()

          manual = os.getenv(
              "MANUAL_BASE_DATE", ""
          ).strip()

          calendar = xcals.get_calendar("XTKS")

          if manual:
              requested = datetime.strptime(
                  manual, "%Y-%m-%d"
              ).date()

              if requested > today:
                  raise RuntimeError(
                      "STOP: future BASE_DATE"
                  )

              if not calendar.is_session(
                  pd.Timestamp(requested)
              ):
                  raise RuntimeError(
                      "STOP: BASE_DATE is not "
                      "a Tokyo Stock Exchange trading day"
                  )

              base_date = requested

          else:
              start = pd.Timestamp(
                  today - timedelta(days=30)
              )
              end = pd.Timestamp(today if datetime.now(ZoneInfo("Asia/Tokyo")).hour >= 18 else today - timedelta(days=1))

              sessions = calendar.sessions_in_range(
                  start, end
              )

              if len(sessions) == 0:
                  raise RuntimeError(
                      "STOP: no trading session found"
                  )

              base_date = sessions[-1].date()

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as f:
              f.write(
                  f"base_date={base_date.isoformat()}\n"
              )

          print("JST today:", today)
          print("Selected BASE_DATE:", base_date)
          PY

      - name: Check Python syntax
        run: |
          python -m py_compile \
            market_data_runner.py \
            sector_indices.py \
            screener.py \
            validate_screening_output.py


      - name: Update CME futures market data
        id: market_update
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.expected_latest_trading_date }}
        run: python market_data_runner.py

      - name: Validate CME market data
        id: market_validation
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          path = Path("output/market_data.json")
          if not path.is_file():
              raise SystemExit("STOP: market_data.json missing")

          data = json.loads(path.read_text(encoding="utf-8"))

          expected = os.environ["BASE_DATE"]
          actual = data.get("base_date")

          print(
              "[MARKET JSON DIAGNOSTICS]",
              f"expected_base_date={expected}",
              f"actual_base_date={actual}",
              f"evaluation_status={data.get('evaluation_status')}",
              f"generated_at={data.get('generated_at')}",
              flush=True,
          )

          if actual != expected:
              raise SystemExit(
                  "STOP: market JSON base date mismatch; "
                  f"expected={expected}, actual={actual}"
              )

          rows = data.get("results")
          if not isinstance(rows, list):
              raise SystemExit("STOP: market results invalid")

          matches = [
              row for row in rows
              if isinstance(row, dict)
              and row.get("key") == "nikkei225_futures_cme"
          ]

          if len(matches) != 1:
              raise SystemExit("STOP: CME futures missing or duplicated")

          cme = matches[0]

          if cme.get("status") != "ok" or cme.get("usable") is not True:
              raise SystemExit(
                  "STOP: CME futures unavailable: "
                  f"{cme.get('reason', cme.get('status'))}"
              )

          if cme.get("evaluation_base_date") != expected:
              raise SystemExit("STOP: CME base date mismatch")

          change = cme.get("change_pct")
          if (
              isinstance(change, bool)
              or not isinstance(change, (int, float))
              or not math.isfinite(change)
          ):
              raise SystemExit("STOP: CME change_pct invalid")

          if data.get("evaluation_status") not in ("ok", "partial"):
              raise SystemExit("STOP: market evaluation unavailable")

          print("CME futures validation OK")
          PY

      - name: Diagnose CME reference market data
        id: reference_diagnostic
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: python market_reference_diagnostic.py          
      - name: Update 18 sector indices
        id: sector_update
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: python sector_indices.py
      - name: Validate 18 sector data
        id: sector_validation
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(
              "output/sector_indices_latest.json"
          )

          if not path.is_file():
              raise SystemExit(
                  "STOP: sector data missing"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          expected = os.environ["BASE_DATE"]

          if data.get(
              "latest_base_date"
          ) != expected:
              raise SystemExit(
                  "STOP: sector base date mismatch"
              )

          rows = data.get("results", [])

          if data.get("sector_count") != 18:
              raise SystemExit(
                  "STOP: sector_count != 18"
              )

          if data.get("processed_count") != 18:
              raise SystemExit(
                  "STOP: processed_count != 18"
              )

          if data.get("failure_count") != 0:
              raise SystemExit(
                  "STOP: sector failures detected"
              )

          if len(rows) != 18:
              raise SystemExit(
                  "STOP: sector results != 18"
              )

          for row in rows:
              if row.get("base_date") != expected:
                  raise SystemExit(
                      "STOP: sector row date mismatch"
                  )

          print("18 sector validation OK")
          PY
      - name: Run four-strategy stock screener
        id: screener
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: python screener.py



      - name: Validate official screening output
        id: screening_validation
        if: >-
          ${{
            steps.market_update.outcome == 'success' &&
            steps.market_validation.outcome == 'success' &&
            steps.sector_update.outcome == 'success' &&
            steps.sector_validation.outcome == 'success' &&
            steps.screener.outcome == 'success'
          }}
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
          VALIDATION_MODE: official
        run: python validate_screening_output.py
      - name: Validate provisional screening output
        id: provisional_validation
        if: >-
          ${{
            steps.screener.outcome == 'success' &&
            steps.screening_validation.outcome != 'success'
          }}
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
          VALIDATION_MODE: provisional
        run: python validate_screening_output.py      

      - name: Validate screening diagnostics
        id: diagnostic_validation
        if: steps.screener.outcome == 'success'
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
          VALIDATION_MODE: diagnostic
        run: python validate_screening_output.py

      - name: Show generated files
        run: find output -maxdepth 3 -type f -print

      - name: Upload screening diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-diagnostics
          path: |
            output/strategy_hits_diagnostic_latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check publication readiness
        id: publication
        if: always()
        continue-on-error: true        
        env:
          MARKET_UPDATE: ${{ steps.market_update.outcome }}
          MARKET_VALIDATION: ${{ steps.market_validation.outcome }}
          SECTOR_UPDATE: ${{ steps.sector_update.outcome }}
          SECTOR_VALIDATION: ${{ steps.sector_validation.outcome }}
          SCREENER: ${{ steps.screener.outcome }}
          OFFICIAL_VALIDATION: ${{ steps.screening_validation.outcome }}
        run: |
          python - <<'PY'
          import os

          checks = {
              "MARKET_UPDATE": os.getenv("MARKET_UPDATE"),
              "MARKET_VALIDATION": os.getenv("MARKET_VALIDATION"),
              "SECTOR_UPDATE": os.getenv("SECTOR_UPDATE"),
              "SECTOR_VALIDATION": os.getenv("SECTOR_VALIDATION"),
              "SCREENER": os.getenv("SCREENER"),
              "OFFICIAL_VALIDATION": os.getenv("OFFICIAL_VALIDATION"),
          }

          print("[PUBLICATION READINESS]", flush=True)

          failed = []

          for name, outcome in checks.items():
              print(f"{name}: {outcome}", flush=True)

              if outcome != "success":
                  failed.append(name)

          if failed:
              raise SystemExit(
                  "STOP: OFFICIAL PUBLICATION NOT READY: "
                  + ", ".join(failed)
              )

          print(
              "[PUBLICATION READY] official",
              flush=True,
          )
          PY


      - name: Export and validate stock JSON
        id: stock_export
        if: steps.publication.outcome == 'success'
        shell: bash
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          set -euo pipefail

          python scripts/export_stock_json.py

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          ranking = json.loads(
              Path("output/strategy_hits_latest.json")
              .read_text(encoding="utf-8")
          )

          base_date = os.environ["BASE_DATE"]
          results = ranking["results"]

          if not results:
              raise SystemExit("STOP: empty results")

          if ranking["base_date"] != base_date:
              raise SystemExit("STOP: ranking date mismatch")

          for stock in results:
              code = str(stock["code"])
              path = Path(f"output/stocks/{code}.json")

              if not path.is_file():
                  raise SystemExit(f"STOP: missing {code}")

              individual = json.loads(
                  path.read_text(encoding="utf-8")
              )

              if individual != stock:
                  raise SystemExit(
                      f"STOP: stock JSON mismatch {code}"
                  )

          print(
              f"[STOCK JSON VALIDATED] "
              f"{base_date} {len(results)} stocks"
          )
          PY


      - name: Commit validated results
        if: steps.publication.outcome == 'success' && steps.stock_export.outcome == 'success'
        shell: bash
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
          OFFICIAL_VALIDATION: ${{ steps.screening_validation.outcome }}
          MARKET_UPDATE: ${{ steps.market_update.outcome }}
          MARKET_VALIDATION: ${{ steps.market_validation.outcome }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$OFFICIAL_VALIDATION" != "success" ]]; then
            echo "STOP: official validation failed"
            exit 1
          fi

          if [[ "$MARKET_UPDATE" != "success" ]] \
             || [[ "$MARKET_VALIDATION" != "success" ]]; then
            echo "STOP: official market validation failed"
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["BASE_DATE"]

          files = [
              (
                  "output/market_data.json",
                  "base_date",
              ),
              (
                  "output/sector_indices_latest.json",
                  "latest_base_date",
              ),
              (
                  "output/strategy_hits_latest.json",
                  "base_date",
              ),
          ]

          for filename, date_field in files:
              path = Path(filename)

              if not path.is_file():
                  raise SystemExit(
                      f"STOP: missing official file: {filename}"
                  )

              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              actual = data.get(date_field)

              if actual != expected:
                  raise SystemExit(
                      f"STOP: {filename} base date mismatch: "
                      f"{actual} != {expected}"
                  )

              if filename == "output/market_data.json":
                  if data.get("evaluation_status") != "ok":
                      raise SystemExit(
                          "STOP: official market status invalid"
                      )

                  if data.get(
                      "official_publication_allowed"
                  ) is not True:
                      raise SystemExit(
                          "STOP: official market publication prohibited"
                      )

              if filename == "output/strategy_hits_latest.json":
                  if data.get(
                      "official_publication_allowed"
                  ) is not True:
                      raise SystemExit(
                          "STOP: official ranking publication prohibited"
                      )

              print(
                  "[OFFICIAL FILE VERIFIED]",
                  filename,
                  flush=True,
              )
          PY

          git add \
            output/strategy_hits_latest.json \
            output/sector_indices_latest.json \
            output/market_data.json

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          ranking = json.loads(
              Path("output/strategy_hits_latest.json")
              .read_text(encoding="utf-8")
          )

          paths = [
              f"output/stocks/{stock['code']}.json"
              for stock in ranking["results"]
          ]

          if not paths:
              raise SystemExit("STOP: no stock JSON")

          subprocess.run(
              ["git", "add", "--", *paths],
              check=True
          )

          print(f"[STOCK JSON STAGED] {len(paths)} files")
          PY
            

          if git diff --cached --quiet; then
            echo "[OFFICIAL RESULTS] No changes to commit"
            exit 0
          fi

          git commit -m "Publish validated screening for ${BASE_DATE}"
          git push

          echo "[OFFICIAL RESULTS PUBLISHED] ${BASE_DATE}"


      - name: Publish provisional screening results
        if: >-
          ${{
            always() &&
            steps.screening_validation.outcome != 'success' &&
            steps.provisional_validation.outcome == 'success'
          }}
        shell: bash
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(
              "output/strategy_hits_provisional_latest.json"
          )

          if not path.is_file():
              raise SystemExit(
                  "STOP: provisional ranking missing"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          expected = os.environ["BASE_DATE"]

          if data.get("base_date") != expected:
              raise SystemExit(
                  "STOP: provisional base_date mismatch"
              )

          if data.get("publication_status") != "provisional":
              raise SystemExit(
                  "STOP: provisional status invalid"
              )

          if not isinstance(data.get("results"), list):
              raise SystemExit(
                  "STOP: provisional results invalid"
              )

          print("[PROVISIONAL FILE VERIFIED]")
          PY

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/strategy_hits_provisional_latest.json

          if [[ -f output/sector_indices_provisional_latest.json ]]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("output/sector_indices_provisional_latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          expected = os.environ["BASE_DATE"]

          actual = data.get(
              "requested_base_date",
              data.get("requested_date")
          )

          if actual != expected:
              raise SystemExit(
                  f"STOP: provisional sector date mismatch: "
                  f"{actual} != {expected}"
              )
          PY
            git add output/sector_indices_provisional_latest.json
          fi

          if git diff --cached --quiet; then
            echo "[PROVISIONAL RESULTS] No changes"
            exit 0
          fi

          git commit -m "Publish provisional screening for ${BASE_DATE}"
          git push

          echo "[PROVISIONAL RESULTS PUBLISHED] ${BASE_DATE}"

