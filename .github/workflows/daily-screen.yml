name: Daily Japan Stock Screener

on:
  workflow_dispatch:
    inputs:
      base_date:
        description: "Base date YYYY-MM-DD"
        required: false
        type: string

  schedule:
    # 平日 17:30 JST = 08:30 UTC
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance openpyxl xlrd requests beautifulsoup4 lxml

      - name: Run stock screener
        run: |
          python screener.py

      - name: Commit screening results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update stock screening results"
            git push
          fi
