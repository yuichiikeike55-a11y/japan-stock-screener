
name: Daily Japan Stock Screener

on:
  workflow_dispatch:
    inputs:
      base_date:
        description: "Base date YYYY-MM-DD (blank = latest JP trading day)"
        required: false
        type: string
  schedule:
    - cron: "15 22 * * 0-4"
permissions:
  contents: write

concurrency:
  group: daily-japan-stock-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas \
            numpy \
            yfinance \
            openpyxl \
            xlrd \
            requests \
            beautifulsoup4 \
            lxml \
            exchange-calendars

      - name: Determine base date
        id: date
        env:
          MANUAL_BASE_DATE: ${{ github.event.inputs.base_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          import pandas as pd
          import exchange_calendars as xcals

          today = datetime.now(
              ZoneInfo("Asia/Tokyo")
          ).date()

          manual = os.getenv(
              "MANUAL_BASE_DATE", ""
          ).strip()

          calendar = xcals.get_calendar("XTKS")

          if manual:
              requested = datetime.strptime(
                  manual, "%Y-%m-%d"
              ).date()

              if requested > today:
                  raise RuntimeError(
                      "STOP: future BASE_DATE"
                  )

              if not calendar.is_session(
                  pd.Timestamp(requested)
              ):
                  raise RuntimeError(
                      "STOP: BASE_DATE is not "
                      "a Tokyo Stock Exchange trading day"
                  )

              base_date = requested

          else:
              start = pd.Timestamp(
                  today - timedelta(days=30)
              )
              end = pd.Timestamp(today if datetime.now(ZoneInfo("Asia/Tokyo")).hour >= 18 else today - timedelta(days=1))

              sessions = calendar.sessions_in_range(
                  start, end
              )

              if len(sessions) == 0:
                  raise RuntimeError(
                      "STOP: no trading session found"
                  )

              base_date = sessions[-1].date()

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as f:
              f.write(
                  f"base_date={base_date.isoformat()}\n"
              )

          print("JST today:", today)
          print("Selected BASE_DATE:", base_date)
          PY

      - name: Check Python syntax
        run: |
          python -m py_compile \
            market_data_runner.py \
            sector_indices.py \
            screener.py \
            validate_screening_output.py


      - name: Update CME futures market data
        id: market_update
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: python market_data_runner.py

      - name: Validate CME market data
        id: market_validation
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          path = Path("output/market_data.json")
          if not path.is_file():
              raise SystemExit("STOP: market_data.json missing")

          data = json.loads(path.read_text(encoding="utf-8"))

          expected = os.environ["BASE_DATE"]
          actual = data.get("base_date")

          print(
              "[MARKET JSON DIAGNOSTICS]",
              f"expected_base_date={expected}",
              f"actual_base_date={actual}",
              f"evaluation_status={data.get('evaluation_status')}",
              f"generated_at={data.get('generated_at')}",
              flush=True,
          )

          if actual != expected:
              raise SystemExit(
                  "STOP: market JSON base date mismatch; "
                  f"expected={expected}, actual={actual}"
              )

          rows = data.get("results")
          if not isinstance(rows, list):
              raise SystemExit("STOP: market results invalid")

          matches = [
              row for row in rows
              if isinstance(row, dict)
              and row.get("key") == "nikkei225_futures_cme"
          ]

          if len(matches) != 1:
              raise SystemExit("STOP: CME futures missing or duplicated")

          cme = matches[0]

          if cme.get("status") != "ok" or cme.get("usable") is not True:
              raise SystemExit(
                  "STOP: CME futures unavailable: "
                  f"{cme.get('reason', cme.get('status'))}"
              )

          if cme.get("evaluation_base_date") != expected:
              raise SystemExit("STOP: CME base date mismatch")

          change = cme.get("change_pct")
          if (
              isinstance(change, bool)
              or not isinstance(change, (int, float))
              or not math.isfinite(change)
          ):
              raise SystemExit("STOP: CME change_pct invalid")

          if data.get("evaluation_status") not in ("ok", "partial"):
              raise SystemExit("STOP: market evaluation unavailable")

          print("CME futures validation OK")
          PY
      - name: Update 18 sector indices
        id: sector_update
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: python sector_indices.py
      - name: Validate 18 sector data
        id: sector_validation
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(
              "output/sector_indices_latest.json"
          )

          if not path.is_file():
              raise SystemExit(
                  "STOP: sector data missing"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          expected = os.environ["BASE_DATE"]

          if data.get(
              "latest_base_date"
          ) != expected:
              raise SystemExit(
                  "STOP: sector base date mismatch"
              )

          rows = data.get("results", [])

          if data.get("sector_count") != 18:
              raise SystemExit(
                  "STOP: sector_count != 18"
              )

          if data.get("processed_count") != 18:
              raise SystemExit(
                  "STOP: processed_count != 18"
              )

          if data.get("failure_count") != 0:
              raise SystemExit(
                  "STOP: sector failures detected"
              )

          if len(rows) != 18:
              raise SystemExit(
                  "STOP: sector results != 18"
              )

          for row in rows:
              if row.get("base_date") != expected:
                  raise SystemExit(
                      "STOP: sector row date mismatch"
                  )

          print("18 sector validation OK")
          PY
      - name: Run four-strategy stock screener
        id: screener
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: python screener.py



      - name: Validate official screening output
        id: screening_validation
        if: >-
          ${{
            steps.market_update.outcome == 'success' &&
            steps.market_validation.outcome == 'success' &&
            steps.sector_update.outcome == 'success' &&
            steps.sector_validation.outcome == 'success' &&
            steps.screener.outcome == 'success'
          }}
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
          VALIDATION_MODE: official
        run: python validate_screening_output.py
      - name: Validate provisional screening output
        id: provisional_validation
        if: steps.screener.outcome == 'success'
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
          VALIDATION_MODE: provisional
        run: python validate_screening_output.py        

      - name: Validate screening diagnostics
        id: diagnostic_validation
        if: steps.screener.outcome == 'success'
        continue-on-error: true
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
          VALIDATION_MODE: diagnostic
        run: python validate_screening_output.py

      - name: Show generated files
        run: find output -maxdepth 3 -type f -print

      - name: Upload screening diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-diagnostics
          path: |
            output/strategy_hits_diagnostic_latest.json
          if-no-files-found: warn
          retention-days: 14


      - name: Check publication readiness
        id: publication
        if: always()
        env:
          MARKET_UPDATE: ${{ steps.market_update.outcome }}
          MARKET_VALIDATION: ${{ steps.market_validation.outcome }}
          SECTOR_UPDATE: ${{ steps.sector_update.outcome }}
          SECTOR_VALIDATION: ${{ steps.sector_validation.outcome }}
          SCREENER: ${{ steps.screener.outcome }}
          OFFICIAL_VALIDATION: ${{ steps.screening_validation.outcome }}
          PROVISIONAL_VALIDATION: ${{ steps.provisional_validation.outcome }}
        run: |
          python - <<'PY'
          import os

          def success(name):
              return os.environ.get(name) == "success"

          sector_ready = (
              success("SECTOR_UPDATE")
              and success("SECTOR_VALIDATION")
          )

          market_ready = (
              success("MARKET_UPDATE")
              and success("MARKET_VALIDATION")
          )

          screener_ready = success("SCREENER")

          official_ready = (
              market_ready
              and sector_ready
              and screener_ready
              and success("OFFICIAL_VALIDATION")
          )

          provisional_ready = (
              sector_ready
              and screener_ready
              and success("PROVISIONAL_VALIDATION")
          )

          print("[PUBLICATION READINESS]", flush=True)

          if official_ready:
              print(
                  "[PUBLICATION READY] official",
                  flush=True,
              )
          elif provisional_ready:
              print(
                  "[PUBLICATION READY] provisional",
                  flush=True,
              )
          else:
              raise SystemExit(
                  "RANKING PUBLICATION NOT READY"
              )
          PY


      - name: Commit validated results
        if: steps.publication.outcome == 'success'
        shell: bash
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
          OFFICIAL_VALIDATION: ${{ steps.screening_validation.outcome }}
          PROVISIONAL_VALIDATION: ${{ steps.provisional_validation.outcome }}
          MARKET_UPDATE: ${{ steps.market_update.outcome }}
          MARKET_VALIDATION: ${{ steps.market_validation.outcome }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$OFFICIAL_VALIDATION" == "success" ]] \
             && [[ "$MARKET_UPDATE" == "success" ]] \
             && [[ "$MARKET_VALIDATION" == "success" ]]; then

            git add output/strategy_hits_latest.json

          elif [[ "$PROVISIONAL_VALIDATION" == "success" ]]; then

            git add output/strategy_hits_provisional_latest.json

          else
            echo "No validated ranking"
            exit 1
          fi

          git add output/sector_indices_latest.json

          if [[ "$MARKET_UPDATE" == "success" ]] \
             && [[ "$MARKET_VALIDATION" == "success" ]]; then
            git add output/market_data.json
          fi

          # 参考地合いJSONを検証して保存する。
          # 正式地合いデータとは区別する。
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          path = Path(
              "output/market_data_reference_latest.json"
          )
          expected = os.environ["BASE_DATE"]

          if not path.is_file():
              print(
                  "[REFERENCE MARKET] file not generated; skip",
                  flush=True,
              )
          else:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              if data.get("base_date") != expected:
                  raise SystemExit(
                      "STOP: reference market base date mismatch"
                  )

              if data.get("evaluation_status") != "reference_only":
                  raise SystemExit(
                      "STOP: reference market status invalid"
                  )

              if data.get("official_publication_allowed") is not False:
                  raise SystemExit(
                      "STOP: reference market publication flag invalid"
                  )

              rows = data.get("results")

              if not isinstance(rows, list) or len(rows) != 1:
                  raise SystemExit(
                      "STOP: reference market results invalid"
                  )

              row = rows[0]

              if (
                  row.get("key") != "nikkei225_futures_cme"
                  or row.get("status") != "ok"
                  or row.get("contract_month_verified") is not False
                  or row.get("usable") is not False
                  or row.get("reference_usable") is not True
              ):
                  raise SystemExit(
                      "STOP: reference market quality flags invalid"
                  )

              for field in ("value", "previous_close", "change_pct"):
                  value = row.get(field)
                  if (
                      isinstance(value, bool)
                      or not isinstance(value, (int, float))
                      or not math.isfinite(value)
                  ):
                      raise SystemExit(
                          f"STOP: reference market {field} invalid"
                      )

              print(
                  "[REFERENCE MARKET VALIDATED]",
                  f"base_date={expected}",
                  f"value={row['value']}",
                  f"previous_close={row['previous_close']}",
                  f"change_pct={row['change_pct']:.4f}",
                  flush=True,
              )
          PY

          if [[ -f output/market_data_reference_latest.json ]]; then
            git add output/market_data_reference_latest.json
            echo "[REFERENCE MARKET STAGED]"
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Publish validated screening for ${BASE_DATE}"
          git push
