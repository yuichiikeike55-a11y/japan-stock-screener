
name: Daily Japan Stock Screener

on:
  workflow_dispatch:
    inputs:
      base_date:
        description: "Base date YYYY-MM-DD (blank = latest JP trading day)"
        required: false
        type: string


  schedule:
    - cron: "0 22 * * 0-4"
permissions:
  contents: write

concurrency:
  group: daily-japan-stock-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas \
            numpy \
            yfinance \
            openpyxl \
            xlrd \
            requests \
            beautifulsoup4 \
            lxml \
            exchange-calendars

      - name: Determine base date
        id: date
        env:
          MANUAL_BASE_DATE: ${{ github.event.inputs.base_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          import pandas as pd
          import exchange_calendars as xcals

          today = datetime.now(
              ZoneInfo("Asia/Tokyo")
          ).date()

          manual = os.getenv(
              "MANUAL_BASE_DATE", ""
          ).strip()

          calendar = xcals.get_calendar("XTKS")

          if manual:
              requested = datetime.strptime(
                  manual, "%Y-%m-%d"
              ).date()

              if requested > today:
                  raise RuntimeError(
                      "STOP: future BASE_DATE"
                  )

              if not calendar.is_session(
                  pd.Timestamp(requested)
              ):
                  raise RuntimeError(
                      "STOP: BASE_DATE is not "
                      "a Tokyo Stock Exchange trading day"
                  )

              base_date = requested

          else:
              start = pd.Timestamp(
                  today - timedelta(days=30)
              )
              end = pd.Timestamp(today if datetime.now(ZoneInfo("Asia/Tokyo")).hour >= 18 else today - timedelta(days=1))

              sessions = calendar.sessions_in_range(
                  start, end
              )

              if len(sessions) == 0:
                  raise RuntimeError(
                      "STOP: no trading session found"
                  )

              base_date = sessions[-1].date()

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as f:
              f.write(
                  f"base_date={base_date.isoformat()}\n"
              )

          print("JST today:", today)
          print("Selected BASE_DATE:", base_date)
          PY

      - name: Check Python syntax
        run: |
          python -m py_compile \
            market_data_runner.py \
            sector_indices.py \
            screener.py \
            validate_screening_output.py

      - name: Update CME futures market data
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: python market_data_runner.py


      - name: Validate Osaka and CME market data
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          path = Path("output/market_data.json")
          if not path.is_file():
              raise SystemExit("STOP: market_data.json missing")

          data = json.loads(path.read_text(encoding="utf-8"))
          expected = os.environ["BASE_DATE"]

          if data.get("base_date") != expected:
              raise SystemExit("STOP: market JSON base date mismatch")

          rows = data.get("results")
          if not isinstance(rows, list):
              raise SystemExit("STOP: market results invalid")

          for name, key in (
              ("Osaka", "nikkei225_futures_osaka"),
              ("CME", "nikkei225_futures_cme"),
          ):
              matches = [
                  row for row in rows
                  if isinstance(row, dict)
                  and row.get("key") == key
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"STOP: {name} futures missing or duplicated"
                  )

              row = matches[0]

              if row.get("status") != "ok" or row.get("usable") is not True:
                  raise SystemExit(
                      f"STOP: {name} futures unavailable: "
                      f"{row.get('reason', row.get('status'))}"
                  )

              if row.get("evaluation_base_date") != expected:
                  raise SystemExit(
                      f"STOP: {name} base date mismatch"
                  )

              change = row.get("change_pct")
              if (
                  isinstance(change, bool)
                  or not isinstance(change, (int, float))
                  or not math.isfinite(change)
              ):
                  raise SystemExit(
                      f"STOP: {name} change_pct invalid"
                  )

              print(f"{name} futures validation OK")

          if data.get("evaluation_status") != "ok":
              raise SystemExit(
                  "STOP: overall market evaluation is not ok"
              )

          print("Osaka and CME validation OK")
          PY
      - name: Update 18 sector indices
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: python sector_indices.py

      - name: Validate 18 sector data
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(
              "output/sector_indices_latest.json"
          )

          if not path.is_file():
              raise SystemExit(
                  "STOP: sector data missing"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          expected = os.environ["BASE_DATE"]

          if data.get(
              "latest_base_date"
          ) != expected:
              raise SystemExit(
                  "STOP: sector base date mismatch"
              )

          rows = data.get("results", [])

          if data.get("sector_count") != 18:
              raise SystemExit(
                  "STOP: sector_count != 18"
              )

          if data.get("processed_count") != 18:
              raise SystemExit(
                  "STOP: processed_count != 18"
              )

          if data.get("failure_count") != 0:
              raise SystemExit(
                  "STOP: sector failures detected"
              )

          if len(rows) != 18:
              raise SystemExit(
                  "STOP: sector results != 18"
              )

          for row in rows:
              if row.get("base_date") != expected:
                  raise SystemExit(
                      "STOP: sector row date mismatch"
                  )

          print("18 sector validation OK")
          PY

      - name: Run four-strategy stock screener
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: python screener.py

      - name: Validate screening output
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: python validate_screening_output.py

      - name: Show generated files
        run: find output -maxdepth 3 -type f -print

      - name: Commit validated results
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update validated screening results"
            git pull --rebase origin main
            git push origin main
          fi

          echo "Commit step completed successfully"
