
name: Daily Japan Stock Screener

on:
  workflow_dispatch:
    inputs:
      base_date:
        description: "Base date YYYY-MM-DD (blank = today JST)"
        required: false
        type: string

  schedule:
    - cron: "30 7 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 9 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "40 10 * * 1-5"
    - cron: "50 10 * * 1-5"
    - cron: "55 10 * * 1-5"
    - cron: "10 11 * * 1-5"
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-japan-stock-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance openpyxl xlrd requests beautifulsoup4 lxml

      - name: Determine base date
        id: date
        env:
          MANUAL_BASE_DATE: ${{ github.event.inputs.base_date }}
        run: |
          if [ -n "$MANUAL_BASE_DATE" ]; then
            BASE_DATE="$MANUAL_BASE_DATE"
          else
            BASE_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          fi

          if ! date -d "$BASE_DATE" +%Y-%m-%d | grep -qx "$BASE_DATE"; then
            echo "::error::Invalid BASE_DATE: $BASE_DATE"
            exit 1
          fi

          echo "base_date=$BASE_DATE" >> "$GITHUB_OUTPUT"
          echo "Target BASE_DATE: $BASE_DATE"

      - name: Check Python syntax
        run: |
          python -m py_compile \
            market_data_runner.py \
            sector_indices.py \
            screener.py

      - name: Update CME futures market data
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          python market_data_runner.py

      - name: Validate CME market data
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("output/market_data.json")
          if not path.is_file():
              raise SystemExit("STOP: market_data.json is missing")

          data = json.loads(path.read_text(encoding="utf-8"))
          rows = data.get("results", [])

          cme = next(
              (
                  row for row in rows
                  if row.get("key") == "nikkei225_futures_cme"
              ),
              None,
          )

          if cme is None:
              raise SystemExit("STOP: CME futures data is missing")

          if cme.get("status") != "ok":
              raise SystemExit(
                  f"STOP: CME status is {cme.get('status')}"
              )

          expected = os.environ["BASE_DATE"]
          actual = cme.get("evaluation_base_date")

          if actual != expected:
              raise SystemExit(
                  f"STOP: CME base date mismatch: "
                  f"expected={expected}, actual={actual}"
              )

          if cme.get("change_pct") is None:
              raise SystemExit("STOP: CME change_pct is missing")

          print("CME market data validation OK")
          PY

      - name: Update 18 sector indices
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          python sector_indices.py

      - name: Validate 18 sector data
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("output/sector_indices_latest.json")
          if not path.is_file():
              raise SystemExit("STOP: sector data is missing")

          data = json.loads(path.read_text(encoding="utf-8"))
          expected = os.environ["BASE_DATE"]

          if data.get("latest_base_date") != expected:
              raise SystemExit(
                  "STOP: sector base date mismatch: "
                  f"expected={expected}, "
                  f"actual={data.get('latest_base_date')}"
              )

          rows = data.get("results", [])

          if data.get("sector_count") != 18:
              raise SystemExit("STOP: sector_count is not 18")

          if data.get("processed_count") != 18:
              raise SystemExit("STOP: processed_count is not 18")

          if data.get("failure_count") != 0:
              raise SystemExit("STOP: sector failure_count is not 0")

          if len(rows) != 18:
              raise SystemExit("STOP: sector results count is not 18")

          for row in rows:
              if row.get("base_date") != expected:
                  raise SystemExit(
                      "STOP: sector row base date mismatch"
                  )

          print("18 sector data validation OK")
          PY

      - name: Run four-strategy stock screener
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          python screener.py

      - name: Validate screening output
        run: |
          python - <<'PY'
          from pathlib import Path

          output = Path("output")
          if not output.is_dir():
              raise SystemExit("STOP: output directory is missing")

          files = [
              p for p in output.rglob("*")
              if p.is_file()
              and p.name not in {
                  "market_data.json",
                  "sector_indices_latest.json",
              }
              and "market_data_history" not in p.parts
          ]

          if not files:
              raise SystemExit(
                  "STOP: no screening output files were found"
              )

          print("Screening output files:")
          for path in files:
              print(path)
          PY

      - name: Show generated files
        run: |
          find output -maxdepth 3 -type f -print

      - name: Commit validated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update validated screening results"
          git pull --rebase origin main
          git push origin main

          git commit -m "Update stock screening results ${{ steps.date.outputs.base_date }}"
          git pull --rebase origin main
          git push origin main

          echo "Screening results pushed successfully."
