name: Daily Japan Stock Screener

on:
  workflow_dispatch:
    inputs:
      base_date:
        description: "Base date YYYY-MM-DD"
        required: false
        type: string

  schedule:
    # JST 16:30
    - cron: "30 7 * * 1-5"

    # JST 17:00
    - cron: "0 8 * * 1-5"

    # JST 17:30
    - cron: "30 8 * * 1-5"

    # JST 18:00
    - cron: "0 9 * * 1-5"

    # JST 18:30
    - cron: "30 9 * * 1-5"

    # JST 19:00
    - cron: "0 10 * * 1-5"

    # JST 19:30
    - cron: "30 10 * * 1-5"

    # JST 19:40
    - cron: "40 10 * * 1-5"

    # JST 19:50
    - cron: "50 10 * * 1-5"

    # JST 19:55
    - cron: "55 10 * * 1-5"

    # JST 20:10（20時までに取れなかった場合の回復用）
    - cron: "10 11 * * 1-5"

    # JST 20:30（最終回復用）
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-japan-stock-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance openpyxl xlrd requests beautifulsoup4 lxml

      - name: Determine base date
        id: date
        env:
          MANUAL_BASE_DATE: ${{ github.event.inputs.base_date }}
        run: |
          if [ -n "$MANUAL_BASE_DATE" ]; then
            BASE_DATE="$MANUAL_BASE_DATE"
          else
            BASE_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          fi

          echo "base_date=$BASE_DATE" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Target BASE_DATE : $BASE_DATE"
          echo "JST time         : $(TZ=Asia/Tokyo date)"
          echo "========================================"

      - name: Run stock screener
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          echo "========================================"
          echo "Stock screener START"
          echo "Target date : $BASE_DATE"
          echo "JST time    : $(TZ=Asia/Tokyo date)"
          echo "========================================"

          python screener.py

          echo "========================================"
          echo "Stock screener COMPLETE"
          echo "JST time : $(TZ=Asia/Tokyo date)"
          echo "========================================"

      - name: Show generated files
        run: |
          echo "========================================"
          echo "Generated output files"
          echo "========================================"

          if [ -d "output" ]; then
            find output -maxdepth 2 -type f -print
          else
            echo "ERROR: output directory does not exist."
            exit 1
          fi

      - name: Commit screening results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "========================================"
            echo "No changes to commit."
            echo "========================================"
          else
            echo "========================================"
            echo "Committing screening results..."
            echo "========================================"

            git commit -m "Update stock screening results ${{ steps.date.outputs.base_date }}"

            echo "========================================"
            echo "Pull latest main..."
            echo "========================================"

            git pull --rebase origin main

            echo "========================================"
            echo "Push results..."
            echo "========================================"

            git push origin main

            echo "========================================"
            echo "Screening results pushed successfully."
            echo "========================================"
          fi