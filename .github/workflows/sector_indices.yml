name: Update Sector Indices

on:
  workflow_dispatch:
    inputs:
      base_date:
        description: "Base date YYYY-MM-DD"
        required: false
        type: string

  schedule:
    # JST 17:30 / 18:30 / 19:30 / 20:30 / 21:30
    - cron: "30 8,9,10,11,12 * * 1-5"

permissions:
  contents: write

jobs:
  update-sector-indices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Determine base date
        id: date
        env:
          MANUAL_BASE_DATE: ${{ github.event.inputs.base_date }}
        run: |
          if [ -n "$MANUAL_BASE_DATE" ]; then
            BASE_DATE="$MANUAL_BASE_DATE"
          else
            BASE_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          fi

          echo "base_date=$BASE_DATE" >> "$GITHUB_OUTPUT"
          echo "Target BASE_DATE: $BASE_DATE"

      - name: Run sector index downloader
        env:
          BASE_DATE: ${{ steps.date.outputs.base_date }}
        run: |
          python sector_indices.py

      - name: Show generated files
        run: |
          echo "=== sector_indices_latest.json ==="
          ls -lh output/sector_indices_latest.json

          echo "=== sector_history ==="
          ls -lh output/sector_history | head -30

      - name: Commit updated sector data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/sector_indices_latest.json
          git add output/sector_history/

          if git diff --cached --quiet; then
            echo "No sector data changes."
          else
            git commit -m "Update sector index data"
            git push
          fi