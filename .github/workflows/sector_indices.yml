name: Update Sector Indices

on:
  workflow_dispatch:

  schedule:
    # 平日 18:30 JST = 09:30 UTC
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:
  update-sector-indices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Run sector index downloader
        run: |
          python sector_indices.py

      - name: Show generated files
        run: |
          echo "=== sector_indices_latest.json ==="
          ls -lh output/sector_indices_latest.json

          echo "=== sector_history ==="
          ls -lh output/sector_history | head -30

      - name: Commit updated sector data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/sector_indices_latest.json
          git add output/sector_history/

          if git diff --cached --quiet; then
            echo "No sector data changes."
          else
            git commit -m "Update sector index data"
            git push
          fi
