
name: Update Sector Indices

on:
  workflow_dispatch:
    inputs:
      base_date:
        description: "Base date YYYY-MM-DD"
        required: false
        type: string

  schedule:
    # Weekdays JST 17:30 - 21:30
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "30 11 * * 1-5"
    - cron: "30 12 * * 1-5"

    # Weekend recovery
    - cron: "30 1 * * 6,0"
    - cron: "30 9 * * 6,0"

permissions:
  contents: write

concurrency:
  group: update-sector-indices
  cancel-in-progress: false

jobs:
  update-sector-indices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance exchange_calendars

      - name: Set BASE_DATE
        id: base_date
        shell: bash
        env:
          MANUAL_BASE_DATE: ${{ github.event.inputs.base_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import pandas as pd
          import exchange_calendars as xcals

          manual = os.environ.get(
              "MANUAL_BASE_DATE", ""
          ).strip()

          calendar = xcals.get_calendar("XTKS")

          if manual:
              target = pd.Timestamp(manual)

              if target.strftime("%Y-%m-%d") != manual:
                  raise ValueError(
                      "Invalid manual BASE_DATE format"
                  )

              if not calendar.is_session(target):
                  raise RuntimeError(
                      f"Manual BASE_DATE {manual} "
                      "is not a TSE trading session."
                  )

              base_date = manual
              print("Manual trading date:", base_date)

          else:
              today = datetime.now(
                  ZoneInfo("Asia/Tokyo")
              ).date()

              target = pd.Timestamp(today)

              if calendar.is_session(target):
                  session = target
              else:
                  session = calendar.date_to_session(
                      target,
                      direction="previous"
                  )

              base_date = session.strftime("%Y-%m-%d")

              print("JST date:", today)
              print("TSE trading date:", base_date)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write(f"base_date={base_date}\n")

          print("FINAL BASE_DATE:", base_date)
          PY

      - name: Run sector index downloader
        env:
          BASE_DATE: ${{ steps.base_date.outputs.base_date }}
        run: |
          echo "Running sector_indices.py"
          echo "BASE_DATE=$BASE_DATE"
          python sector_indices.py

      - name: Validate generated sector data
        env:
          BASE_DATE: ${{ steps.base_date.outputs.base_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(
              "output/sector_indices_latest.json"
          )

          if not path.exists():
              raise RuntimeError(
                  "Sector latest JSON not found"
              )

          with path.open(
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          expected = os.environ["BASE_DATE"]
          results = data.get("results", [])

          if len(results) != 18:
              raise RuntimeError(
                  f"Expected 18 sectors, "
                  f"got {len(results)}"
              )

          if data.get("failure_count") != 0:
              raise RuntimeError(
                  "Sector failures detected"
              )

          if data.get("processed_count") != 18:
              raise RuntimeError(
                  "Processed count is not 18"
              )

          if data.get("latest_base_date") != expected:
              raise RuntimeError(
                  "Latest base date mismatch"
              )

          dates = {
              row.get("base_date")
              for row in results
          }

          if dates != {expected}:
              raise RuntimeError(
                  f"Sector dates mismatch: {dates}"
              )

          print(
              "VALIDATED: 18/18 sectors",
              "BASE_DATE:", expected
          )
          PY

      - name: Show generated files
        run: |
          echo "=== output ==="
          ls -lah output

          echo "=== sector history ==="
          ls -lah output/sector_history

          echo "=== latest sector JSON ==="
          head -n 40 output/sector_indices_latest.json


      - name: Commit and push sector data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/sector_indices_latest.json
          git add output/sector_history/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update sector indices ${{ steps.base_date.outputs.base_date }}"

          # Rebase前に未ステージ変更を退避
          git stash push --include-untracked -m "temporary workflow changes"

          git pull --rebase origin main

          git push origin HEAD:main

          echo "Sector data pushed successfully."
          git push origin main
