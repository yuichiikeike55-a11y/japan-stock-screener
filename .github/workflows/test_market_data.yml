name: Test Market Data

on:
  workflow_dispatch:

jobs:
  test-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests beautifulsoup4

      - name: Test market data
        run: |
          python test_market_data.py
      - name: Test Osaka Nikkei 225 Futures
        run: |
          python test_osaka_futures.py
      - name: Test CME Nikkei 225 Futures
        run: |
          python test_cme_futures.py          
      - name: Run market data runner
        run: |
          python market_data_runner.py          
