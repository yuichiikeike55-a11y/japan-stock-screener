name: Test Market Data

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests beautifulsoup4

      - name: Test market data
        run: |
          python test_market_data.py
      - name: Test Osaka Nikkei 225 Futures
        run: |
          python test_osaka_futures.py
      - name: Test CME Nikkei 225 Futures
        run: |
          python test_cme_futures.py          
      - name: Run market data runner
        run: |
          python market_data_runner.py          
      - name: Show market data JSON
        run: |
          cat output/market_data.json
      - name: Commit market data JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/market_data.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push
