
name: Test Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "50 23 * * 0-4"

permissions:
  contents: write

concurrency:
  group: test-market-data
  cancel-in-progress: false

jobs:
  test-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            yfinance \
            pandas \
            numpy \
            requests \
            beautifulsoup4 \
            exchange_calendars

      - name: Test market data
        run: |
          python test_market_data.py

      - name: Test Osaka Nikkei 225 Futures
        run: |
          python test_osaka_futures.py

      - name: Test CME Nikkei 225 Futures
        run: |
          python test_cme_futures.py

      - name: Run market data runner
        run: |
          python market_data_runner.py

      - name: Show market data JSON
        run: |
          if [ ! -f output/market_data.json ]; then
            echo "ERROR: market_data.json not found"
            exit 1
          fi

          python -m json.tool output/market_data.json

      - name: Commit market data JSON
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/market_data.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update market data"

          git stash push --include-untracked -m "temporary market data workflow changes"

          git pull --rebase origin main

          git push origin HEAD:main

          echo "Market data pushed successfully."
