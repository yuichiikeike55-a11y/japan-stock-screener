
name: Test Stock JSON Export

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/export_stock_json.py"
      - ".github/workflows/daily-screen.yml"
      - ".github/workflows/test-stock-json.yml"

permissions:
  contents: read

jobs:
  test-stock-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/export_stock_json.py

      - name: Export stock JSON
        run: |
          python scripts/export_stock_json.py

      - name: Verify generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ranking = json.loads(
              Path("output/strategy_hits_latest.json")
              .read_text(encoding="utf-8")
          )

          results = ranking["results"]

          if not results:
              raise SystemExit("STOP: no stock results")

          for stock in results:
              code = str(stock["code"])
              path = Path(f"output/stocks/{code}.json")

              if not path.is_file():
                  raise SystemExit(f"STOP: missing {code}")

              individual = json.loads(
                  path.read_text(encoding="utf-8")
              )

              if individual != stock:
                  raise SystemExit(
                      f"STOP: data mismatch {code}"
                  )

          print(
              f"[TEST PASSED] "
              f"base_date={ranking['base_date']} "
              f"stocks={len(results)}"
          )
          PY

      - name: Confirm no publication
        run: |
          echo "TEST ONLY: No commit or push performed"
