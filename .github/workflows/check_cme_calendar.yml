
name: Check CME Calendar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install calendar
        run: |
          python -m pip install --upgrade pip
          pip install exchange-calendars pandas

      - name: Inspect NKD calendar candidates
        run: |
          python - <<'PY'
          from datetime import date, datetime, time, timedelta
          from zoneinfo import ZoneInfo

          import pandas as pd
          import exchange_calendars as xcals

          JST = ZoneInfo("Asia/Tokyo")
          ET = ZoneInfo("America/New_York")

          cal = xcals.get_calendar("CMES")

          test_dates = [
              "2026-10-30",
              "2026-11-02",
              "2026-11-03",
              "2026-11-26",
              "2026-11-27",
              "2026-12-24",
              "2026-12-25",
              "2026-12-31",
              "2027-01-01",
          ]

          print("=== CALENDAR VERSION ===")
          print("exchange_calendars:", xcals.__version__)
          print("calendar:", type(cal).__name__)

          print("\n=== NKD SESSION CANDIDATES ===")

          for raw in test_dates:
              day = date.fromisoformat(raw)
              stamp = pd.Timestamp(raw)

              if not cal.is_session(stamp):
                  print(
                      "DATE:", raw,
                      "STATUS: CLOSED",
                      "ACTION: STOP",
                  )
                  continue

              cmes_close = cal.session_close(stamp)
              cmes_close_jst = cmes_close.tz_convert(JST)

              # NKDの通常終了時刻の候補。
              # これだけで正式検証済みとはしない。
              nkd_regular_end = datetime.combine(
                  day,
                  time(17, 0),
                  tzinfo=ET,
              ).astimezone(JST)

              # CMES通常終了時刻との差は
              # これまでの検証例では1時間。
              expected_cmes_regular_close = (
                  nkd_regular_end + timedelta(hours=1)
              )

              is_regular_candidate = (
                  cmes_close_jst.to_pydatetime()
                  == expected_cmes_regular_close
              )

              print("DATE:", raw)
              print(
                  "  CMES_CLOSE_JST:",
                  cmes_close_jst.isoformat(),
              )
              print(
                  "  NKD_REGULAR_END_CANDIDATE:",
                  nkd_regular_end.isoformat(),
              )
              print(
                  "  CMES_REGULAR_RELATION_MATCH:",
                  is_regular_candidate,
              )

              if is_regular_candidate:
                  print(
                      "  STATUS: REGULAR_CANDIDATE"
                  )
                  print(
                      "  ACTION: REQUIRE_NKD_VERIFICATION"
                  )
              else:
                  print(
                      "  STATUS: SPECIAL_OR_UNKNOWN"
                  )
                  print(
                      "  ACTION: STOP"
                  )

          print("\n=== EARLY CLOSES ===")
          try:
              early = cal.early_closes

              # DatetimeIndexのタイムゾーン差による
              # 比較エラーを避ける。
              early = pd.DatetimeIndex(early)
              if early.tz is not None:
                  early = early.tz_localize(None)

              start = pd.Timestamp("2026-10-01")
              end = pd.Timestamp("2027-01-31")

              selected = early[
                  (early >= start) & (early <= end)
              ]

              for item in selected:
                  print("EARLY_CLOSE:", item.date())

              if len(selected) == 0:
                  print("No early closes in selected range")

          except Exception as exc:
              print(
                  "EARLY_CLOSES_ERROR:",
                  type(exc).__name__,
                  str(exc),
              )
              raise

          print("\n=== SAFETY ===")
          print(
              "This workflow does not approve "
              "NKD sessions for production."
          )
          print(
              "CMES is used only to identify "
              "regular candidates and special dates."
          )
          print(
              "NKD-specific official verification "
              "is still required."
          )
          PY
