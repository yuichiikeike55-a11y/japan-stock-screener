
name: Apply CME Market Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify required files
        run: |
          test -f screener.py
          test -f fix_cme_market.py

      - name: Apply CME-only scoring fix
        run: |
          python fix_cme_market.py

      - name: Verify Python syntax
        run: |
          python -m py_compile screener.py

      - name: Show changed lines
        run: |
          git diff --check
          git diff -- screener.py

      - name: Commit screener change
        run: |
          if git diff --quiet -- screener.py; then
            echo "STOP: screener.py was not changed"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add screener.py
          git commit -m "Use CME-only 6-point market scoring"
          git push
